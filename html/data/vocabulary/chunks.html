  <script>
    function cleanValue(value) { return String(value || "").trim(); }
    function splitSentences(value) { return cleanValue(value).split(/(?<=[.!?])\s+/).map(part => part.trim()).filter(Boolean); }
    const data = JSON.parse(document.getElementById("json-data").textContent);
    document.getElementById("count").textContent = `${data.length} chunks`;
    const grid = document.getElementById("grid");
    for (const item of data) {
      const card = document.createElement("article");
      card.className = "card";
      const head = document.createElement("div");
      head.className = "head";
      head.innerHTML = `<span class="chunk">${item.chunk}</span> <span class="level">(${item.level})</span> <span class="cz">- ${cleanValue(item.cz)}</span>`;
      card.appendChild(head);
      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = cleanValue(item.desc);
      card.appendChild(desc);
      const usage = document.createElement("div");
      usage.className = "usage";
      usage.textContent = cleanValue(item.usage);
      card.appendChild(usage);
      const examples = document.createElement("div");
      examples.className = "examples";
      for (const line of splitSentences(item.example)) {
        const sentence = document.createElement("span");
        sentence.className = "sentence";
        sentence.textContent = line;
        examples.appendChild(sentence);
      }
      card.appendChild(examples);
      grid.appendChild(card);
    }
  </script>
<script>
(function () {
  function shuffleInPlace(items) {
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = items[i];
      items[i] = items[j];
      items[j] = temp;
    }
    return items;
  }

  function initShuffle() {
    const grid = document.querySelector('.grid');
    const button = document.getElementById('shuffle-toggle');
    if (!grid || !button) {
      return;
    }

    const cards = Array.from(grid.children);
    if (!cards.length) {
      return;
    }

    cards.forEach((card, index) => {
      card.dataset.originalIndex = String(index);
    });

    const originalOrder = cards.slice();
    let shuffled = false;

    button.addEventListener('click', function () {
      let nextOrder;
      if (!shuffled) {
        nextOrder = shuffleInPlace(cards.slice());
        shuffled = true;
        button.classList.add('is-active');
        button.setAttribute('aria-pressed', 'true');
      } else {
        nextOrder = originalOrder.slice().sort((a, b) => Number(a.dataset.originalIndex) - Number(b.dataset.originalIndex));
        shuffled = false;
        button.classList.remove('is-active');
        button.setAttribute('aria-pressed', 'false');
      }

      nextOrder.forEach((card) => grid.appendChild(card));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initShuffle);
  } else {
    initShuffle();
  }
})();
</script>
