      padding: 12px 14px;

    .main { min-width: 0; }
    .head { font-size: 14pt; line-height: 1.22; margin-bottom: 6px; }
    .word { font-weight: 700; }
    .level { font-weight: 400; }

    .cz { font-weight: 400; }

    .usage { font-size: 13pt; line-height: 1.24; color: #3e3a34; }
    .examples { font-size: 13pt; line-height: 1.24; font-style: italic; color: #423d37; margin-top: 6px; }

    .syn-box {

      justify-self: end;
      width: 100%;
      background: var(--side);
      border: 1px solid var(--rule);

  <script>
    function cleanValue(value) {
      return String(value || "")
        .replace(/^Typical phrase:\s*/i, "")
        .replace(/^Typical use:\s*/i, "")
        .trim();
    }
    function splitSentences(value) {
      return cleanValue(value).split(/(?<=[.!?])\s+/).map(part => part.trim()).filter(Boolean);
    }

    const data = JSON.parse(document.getElementById("json-data").textContent);
    document.getElementById("count").textContent = `${data.length} slovicek (vyslovnost - Cambridge)`;

    const grid = document.getElementById("grid");
    for (const item of data) {
      const card = document.createElement("article");
      card.className = "card";

      const main = document.createElement("div");
      main.className = "main";

      const head = document.createElement("div");
      head.className = "head";
      const cambridgeUrl = `https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(item.en.toLowerCase())}`;
      head.innerHTML = `<span class="word">${item.en}</span> <span class="level">(${item.level})</span><a class="pronunciation-link" href="${cambridgeUrl}" title="Cambridge pronunciation">🔊</a> <span class="cz">- ${cleanValue(item.cz)}</span>`;
      main.appendChild(head);

      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = cleanValue(item.desc);
      main.appendChild(desc);

      const usage = document.createElement("div");
      usage.className = "usage";
      usage.textContent = cleanValue(item.usage);
      main.appendChild(usage);

      const examples = document.createElement("div");
      examples.className = "examples";
      for (const line of splitSentences(item.example)) {
        const sentence = document.createElement("span");
        sentence.className = "sentence";
        sentence.textContent = line;
        examples.appendChild(sentence);
      }
      main.appendChild(examples);
      card.appendChild(main);

      const synBox = document.createElement("aside");
      synBox.className = "syn-box";

      if (item.synonyms && item.synonyms.length) {
        for (const syn of item.synonyms) {
          const synItem = document.createElement("div");
          synItem.className = "syn-item";
          const synWord = document.createElement("span");
          synWord.className = "syn-word";
          synWord.textContent = syn.word;
          const synExp = document.createElement("span");
          synExp.className = "syn-exp";
          synExp.textContent = ` ${syn.explanation}`;
          synItem.appendChild(synWord);
          synItem.appendChild(synExp);
          synBox.appendChild(synItem);
        }
      } else {
        const empty = document.createElement("div");
        empty.className = "syn-empty";
        empty.textContent = 'bez synonym';
        synBox.appendChild(empty);
      }

      card.appendChild(synBox);
      grid.appendChild(card);
    }
  </script>
<script>
(function () {
  function shuffleInPlace(items) {
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = items[i];
      items[i] = items[j];
      items[j] = temp;
    }
    return items;
  }

  function initShuffle() {
    const grid = document.querySelector('.grid');
    const button = document.getElementById('shuffle-toggle');
    if (!grid || !button) {
      return;
    }

    const cards = Array.from(grid.children);
    if (!cards.length) {
      return;
    }

    cards.forEach((card, index) => {
      card.dataset.originalIndex = String(index);
    });

    const originalOrder = cards.slice();
    let shuffled = false;

    button.addEventListener('click', function () {
      let nextOrder;
      if (!shuffled) {
        nextOrder = shuffleInPlace(cards.slice());
        shuffled = true;
        button.classList.add('is-active');
        button.setAttribute('aria-pressed', 'true');
      } else {
        nextOrder = originalOrder.slice().sort((a, b) => Number(a.dataset.originalIndex) - Number(b.dataset.originalIndex));
        shuffled = false;
        button.classList.remove('is-active');
        button.setAttribute('aria-pressed', 'false');
      }

      nextOrder.forEach((card) => grid.appendChild(card));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initShuffle);
  } else {
    initShuffle();
  }
})();
</script>
